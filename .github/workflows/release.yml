name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for softprops/action-gh-release to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gnome-extensions CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell   # provides the `gnome-extensions` binary

      - name: Check tag matches metadata version-name
        run: |
          tag="${GITHUB_REF_NAME#v}"
          meta="$(python3 -c 'import json;print(json.load(open("metadata.json"))["version-name"])')"
          if [ "$tag" != "$meta" ]; then
            echo "::error::Tag v$tag does not match metadata.json version-name ($meta)"
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p dist   # gnome-extensions pack segfaults if --out-dir is missing
          gnome-extensions pack --force \
            --extra-source=usageModel.js \
            --extra-source=usageClient.js \
            --extra-source=icons \
            --out-dir=dist \
            .
          # pack always names the zip after the UUID; add the tag so release
          # assets are distinguishable across versions
          mv dist/claude-quota@andrearicchi.com.shell-extension.zip \
             "dist/claude-quota@andrearicchi.com-${GITHUB_REF_NAME}.shell-extension.zip"
          unzip -l dist/*.shell-extension.zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Shexli static analyzer
        run: |
          # tree-sitter 0.26 is ABI-incompatible with tree-sitter-javascript 0.25
          # and segfaults; pin below it until shexli's deps catch up.
          pip install -U shexli 'tree-sitter<0.26'
          shexli dist/*.shell-extension.zip          # human-readable report in the log
          shexli --format json dist/*.shell-extension.zip > shexli.json
          # shexli 0.2.1 treats any shell-version above 50 as an implausible
          # future release (EGO-M-004), so "51" always fails; skip that rule
          # until a shexli release knows GNOME 51.
          count=$(jq '[.findings[] | select(.rule_id != "EGO-M-004")] | length' shexli.json)
          if [ "$count" -ne 0 ]; then
            echo "::error::Shexli reported $count finding(s) — see the report above"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.shell-extension.zip
          generate_release_notes: true
